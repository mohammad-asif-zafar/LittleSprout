name: Android CI/CD

on:
  push:
    branches:
      - main

    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ============================================================
  # ANDROID CI
  #
  # Runs for:
  #   - pushes to main
  #   - pull requests to main
  #   - manual workflow dispatch
  #
  # Does NOT run for version tags.
  # ============================================================

  ci:
    name: Android CI

    if: >
      github.event_name != 'push' ||
      !startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle


      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6


      # --------------------------------------------------------
      # Make Gradle wrapper executable
      # --------------------------------------------------------

      - name: Make gradlew executable
        run: chmod +x ./gradlew


      # --------------------------------------------------------
      # Build Android Debug APK
      # --------------------------------------------------------

      - name: Build Android Debug
        run: |
          ./gradlew \
            --no-daemon \
            :androidApp:assembleDebug


      # --------------------------------------------------------
      # Upload Debug APK
      # --------------------------------------------------------

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: LittleSprout-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14



  # ============================================================
  # ANDROID RELEASE
  #
  # Trigger:
  #
  #   git tag v1.0.4
  #   git push origin v1.0.4
  #
  # Produces:
  #
  #   1. Signed AAB
  #   2. Signed APK
  #   3. GitHub Release
  #
  # AAB:
  #   Google Play Store
  #
  # APK:
  #   Manual installation/testing
  # ============================================================

  release:
    name: Android Release

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------------------------
      # Checkout exact tagged commit
      # --------------------------------------------------------

      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Verify tag belongs to main
      # --------------------------------------------------------

      - name: Verify tag is on main
        shell: bash
        run: |
          git fetch origin main --prune

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "ERROR: $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

          echo "Tag $GITHUB_REF_NAME is valid and belongs to main."


      # --------------------------------------------------------
      # Validate release tag
      #
      # Required:
      #
      #   vMAJOR.MINOR.PATCH
      #
      # Examples:
      #
      #   v1.0.4
      #   v1.1.0
      #   v2.0.0
      # --------------------------------------------------------

      - name: Validate release tag
        id: version
        shell: bash
        run: |

          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR:"
            echo "Release tags must use:"
            echo "vMAJOR.MINOR.PATCH"
            echo
            echo "Example:"
            echo "v1.0.4"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"


          # ----------------------------------------------------
          # Calculate Android versionCode
          #
          # v1.0.4 -> 1000004
          # v1.1.0 -> 1001000
          # v2.0.0 -> 2000000
          # ----------------------------------------------------

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))


          # ----------------------------------------------------
          # Google Play versionCode safety check
          # ----------------------------------------------------

          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "ERROR: calculated versionCode is too large."
            exit 1
          fi


          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo
          echo "========================================"
          echo "Release Version"
          echo "========================================"
          echo "Version name : $VERSION"
          echo "Version code : $VERSION_CODE"
          echo "========================================"


      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle


      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6


      # --------------------------------------------------------
      # Make Gradle wrapper executable
      # --------------------------------------------------------

      - name: Make gradlew executable
        run: chmod +x ./gradlew


      # --------------------------------------------------------
      # Restore Android signing key
      #
      # GitHub Secret:
      #
      #   ANDROID_KEYSTORE_BASE64
      # --------------------------------------------------------

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

        run: |

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > \
            "$RUNNER_TEMP/littlesprout-upload-key.jks"

          if [ ! -f "$RUNNER_TEMP/littlesprout-upload-key.jks" ]; then
            echo "ERROR: Failed to restore Android keystore."
            exit 1
          fi

          echo "Android keystore restored."


      # --------------------------------------------------------
      # Build SIGNED AAB + APK
      # --------------------------------------------------------

      - name: Build signed Android release
        env:

          # ----------------------------------------------------
          # Signing
          # ----------------------------------------------------

          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/littlesprout-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

          # ----------------------------------------------------
          # Version
          # ----------------------------------------------------

          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}

        run: |

          # ----------------------------------------------------
          # Validate signing secrets
          # ----------------------------------------------------

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi


          # ----------------------------------------------------
          # Build release AAB + APK
          # ----------------------------------------------------

          ./gradlew \
            --no-daemon \
            :androidApp:bundleRelease \
            :androidApp:assembleRelease


      # --------------------------------------------------------
      # Show generated files
      # --------------------------------------------------------

      - name: Inspect release outputs
        shell: bash
        run: |

          echo
          echo "========================================"
          echo "AAB OUTPUT"
          echo "========================================"

          find androidApp/build/outputs/bundle/release \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            -print


          echo
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          find androidApp/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print


      # --------------------------------------------------------
      # Prepare release files
      #
      # IMPORTANT:
      # Do NOT assume the APK filename.
      # Find the actual generated files.
      # --------------------------------------------------------

      - name: Prepare release files
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}

        shell: bash
        run: |

          mkdir -p release


          # ----------------------------------------------------
          # Find AAB
          # ----------------------------------------------------

          AAB_FILE=$(find \
            androidApp/build/outputs/bundle/release \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            | head -n 1)


          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: No release AAB was generated."
            exit 1
          fi


          # ----------------------------------------------------
          # Find APK
          # ----------------------------------------------------

          APK_FILE=$(find \
            androidApp/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No release APK was generated."
            exit 1
          fi


          # ----------------------------------------------------
          # Copy AAB
          # ----------------------------------------------------

          cp "$AAB_FILE" \
            "release/LittleSprout-${VERSION_NAME}.aab"


          # ----------------------------------------------------
          # Copy APK
          # ----------------------------------------------------

          cp "$APK_FILE" \
            "release/LittleSprout-${VERSION_NAME}.apk"


          # ----------------------------------------------------
          # Verify final release files
          # ----------------------------------------------------

          echo
          echo "========================================"
          echo "FINAL RELEASE FILES"
          echo "========================================"

          ls -lh release/


          echo
          echo "========================================"
          echo "Release contents"
          echo "========================================"

          find release \
            -maxdepth 1 \
            -type f \
            -print


          # ----------------------------------------------------
          # Make absolutely sure both exist
          # ----------------------------------------------------

          test -f "release/LittleSprout-${VERSION_NAME}.aab"
          test -f "release/LittleSprout-${VERSION_NAME}.apk"

          echo
          echo "SUCCESS: Both AAB and APK were created."


      # --------------------------------------------------------
      # Upload release artifacts to GitHub Actions
      # --------------------------------------------------------

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LittleSprout-${{ steps.version.outputs.version_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30


      # --------------------------------------------------------
      # Create GitHub Release
      #
      # The GitHub Release will contain:
      #
      #   LittleSprout-X.Y.Z.aab
      #   LittleSprout-X.Y.Z.apk
      # --------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}

        run: |

          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --title "LittleSprout ${VERSION_NAME}" \
            --generate-notes