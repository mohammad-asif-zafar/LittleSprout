name: Android CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # CI - Runs for pull requests and normal pushes to main
  # ============================================================
  ci:
    name: Android CI

    if: >
      github.event_name != 'push' ||
      !startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Java
      # Your project currently uses Java 11 compile options.
      # AGP 9 / Gradle 9 can run with JDK 17.
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------------
      # Make Gradle wrapper executable
      # --------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # --------------------------------------------------------
      # Android Debug Build
      # --------------------------------------------------------
      - name: Build Android Debug
        run: ./gradlew --no-daemon :androidApp:assembleDebug

      # --------------------------------------------------------
      # Upload debug APK
      # --------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: littlesprout-debug-${{ github.sha }}
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14


  # ============================================================
  # RELEASE
  #
  # Trigger:
  #
  #   git tag v1.0.3
  #   git push origin v1.0.3
  #
  # This job:
  #   1. Validates the tag
  #   2. Verifies tag is part of main
  #   3. Creates signed AAB
  #   4. Creates signed APK
  #   5. Creates GitHub Release
  # ============================================================
  release:
    name: Android Release

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # --------------------------------------------------------
      # Checkout exact tagged commit
      # --------------------------------------------------------
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # Verify release tag belongs to main
      # --------------------------------------------------------
      - name: Verify tag is on main
        run: |
          git fetch origin main --prune

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "ERROR: $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

          echo "Tag $GITHUB_REF_NAME is valid and belongs to main."

      # --------------------------------------------------------
      # Validate tag
      #
      # Examples:
      #
      #   v1.0.3
      #   v1.2.0
      #   v2.0.0
      #
      # Not allowed:
      #
      #   release-1.0.3
      #   1.0.3
      #   v1.0
      # --------------------------------------------------------
      - name: Validate release tag
        id: version
        shell: bash
        run: |

          TAG="$GITHUB_REF_NAME"

          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then

            echo "ERROR:"
            echo "Release tags must use:"
            echo "vMAJOR.MINOR.PATCH"
            echo
            echo "Example:"
            echo "v1.0.3"

            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          # --------------------------------------------------
          # Android versionCode
          #
          # Example:
          #
          # v1.0.3 -> 1000003
          # v1.2.0 -> 1002000
          # v2.0.0 -> 2000000
          #
          # Must stay within Google's integer limit.
          # --------------------------------------------------

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))

          if [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "ERROR: calculated versionCode is too large."
            exit 1
          fi

          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Version name : $VERSION"
          echo "Version code : $VERSION_CODE"

      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # --------------------------------------------------------
      # Gradle
      # --------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------------
      # Gradle wrapper permission
      # --------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # --------------------------------------------------------
      # Restore Android signing key
      #
      # GitHub Secret:
      #
      # ANDROID_KEYSTORE_BASE64
      # --------------------------------------------------------
      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > \
            "$RUNNER_TEMP/littlesprout-upload-key.jks"

          test -f "$RUNNER_TEMP/littlesprout-upload-key.jks"

          echo "Android keystore restored."

      # --------------------------------------------------------
      # Build SIGNED AAB + APK
      # --------------------------------------------------------
      - name: Build signed Android release
        env:

          # Signing
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/littlesprout-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

          # Version
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}

        run: |

          # -----------------------------------------------
          # Check required secrets
          # -----------------------------------------------

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is missing."
            exit 1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is missing."
            exit 1
          fi

          # -----------------------------------------------
          # Build AAB
          # -----------------------------------------------

          ./gradlew \
            --no-daemon \
            :androidApp:bundleRelease \
            :androidApp:assembleRelease

      # --------------------------------------------------------
      # Rename files
      # --------------------------------------------------------
      - name: Prepare release files
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |

          mkdir -p release

          cp \
            androidApp/build/outputs/bundle/release/androidApp-release.aab \
            "release/LittleSprout-${VERSION_NAME}.aab"

          cp \
            androidApp/build/outputs/apk/release/androidApp-release.apk \
            "release/LittleSprout-${VERSION_NAME}.apk"

          echo "Release files:"
          ls -lh release/

      # --------------------------------------------------------
      # Upload workflow artifacts
      # --------------------------------------------------------
      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LittleSprout-${{ steps.version.outputs.version_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |

          gh release create "$GITHUB_REF_NAME" \
            release/* \
            --title "LittleSprout ${VERSION_NAME}" \
            --generate-notes